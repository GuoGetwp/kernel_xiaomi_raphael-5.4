name: Build Kernel Raphael 5.4

on:
  workflow_dispatch: # 手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: zundamon-miui-5.4
        submodules: 'recursive'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl bc bison flex libssl-dev libelf-dev zip unzip python3 python-is-python3 gcc-aarch64-linux-gnu clang llvm lld device-tree-compiler

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 生成配置
        make O=out ARCH=arm64 raphael_defconfig
        
        # 编译主内核和 dtbo，强制跳过警告报错
        make O=out ARCH=arm64 KCFLAGS="-Wno-error" -j2
        make O=out ARCH=arm64 KCFLAGS="-Wno-error" dtbo.img 2>/dev/null || true

    - name: Download AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        
    - name: Package ZIP
      run: |
        cd anykernel
        sed -i 's/device.name1=.*/device.name1=raphael/' anykernel.sh 2>/dev/null || true
        
        # ================= 终极防漏打包 =================
        # 1. 抓取内核本体
        cp ../out/arch/arm64/boot/Image.gz ./ 2>/dev/null || cp ../out/arch/arm64/boot/Image ./ 2>/dev/null || true
        
        # 2. 抓取根目录的 dtbo.img
        cp ../out/arch/arm64/boot/dtbo.img ./ 2>/dev/null || true
        
        # 3. 搜索所有相关的设备树文件 (dtb/dtbo) 并全部打包
        find ../out/arch/arm64/boot/dts/qcom/ -name "*raphael*" -exec cp {} ./ \; 2>/dev/null || true
        find ../out/arch/arm64/boot/dts/qcom/ -name "sm8150*" -exec cp {} ./ \; 2>/dev/null || true
        
        # 4. 打印最终打包的文件列表，方便你核对
        echo "================ 最终打包文件列表 ================"
        ls -lh
        echo "================================================="
        
        # 5. 打包
        zip -r9 ../Raphael-5.4-Kernel.zip *
        # ===============================================

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Raphael-5.4-Kernel
        path: Raphael-5.4-Kernel.zip
