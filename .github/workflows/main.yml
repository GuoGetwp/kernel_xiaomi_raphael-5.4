name: Build Kernel Raphael 5.4

on:
  workflow_dispatch: # 手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: zundamon-miui-5.4
        submodules: 'recursive'

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git curl bc bison flex libssl-dev libelf-dev zip unzip python3 python-is-python3 gcc-aarch64-linux-gnu clang llvm lld device-tree-compiler

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        make O=out ARCH=arm64 raphael_defconfig
        
        # 强制跳过警告报错
        make O=out ARCH=arm64 KCFLAGS="-Wno-error" -j2

    - name: Download AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git -b master anykernel
        
    - name: Package ZIP
      run: |
        cd anykernel
        # 修改设备代号，加 || true 防止找不到文件报错中断
        sed -i 's/device.name1=.*/device.name1=raphael/' anykernel.sh 2>/dev/null || true
        
        # 拷贝产物，加 || true 防止缺失文件报错中断
        cp ../out/arch/arm64/boot/Image.gz ./ 2>/dev/null || true
        cp ../out/arch/arm64/boot/Image ./ 2>/dev/null || true
        cp ../out/arch/arm64/boot/dtbo.img ./ 2>/dev/null || true
        
        # 只要内核存在就打包
        if [ -f Image.gz ] || [ -f Image ]; then
          zip -r9 ../Raphael-5.4-Kernel.zip *
        else
          echo "错误：找不到编译出的内核文件！"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Raphael-5.4-Kernel
        path: Raphael-5.4-Kernel.zip
